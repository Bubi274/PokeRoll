# Phát hành bản desktop khi push tag vX.Y.Z (tạo bằng: npm run release -- patch|minor|major).
#   1. version + ci: tag phải trùng version trong package.json, và lượt CI (ci.yml) trên đúng commit của tag phải đã
#      thành công (scripts/wait-for-ci.js chờ lượt CI đó chạy xong). Không chạy lại test ở đây. Lỗi thì dừng, không phát hành.
#   2. build:   Windows (installer NSIS) và Linux (AppImage) chạy song song, chưa đăng gì.
#   3. release: gom file của cả hai rồi tạo một GitHub Release, kèm latest.yml / latest-linux.yml cho electron-updater.
# App không ký số: electron-builder bỏ qua bước ký khi không có chứng chỉ.
#
# Bảo mật:
#   - Chỉ chạy khi push tag v*.*.*; không có secret nào ngoài GITHUB_TOKEN do Actions cấp cho mỗi lượt chạy.
#   - Quyền mặc định chỉ đọc; job ci đọc thêm Actions (actions: read) để xem kết quả CI; riêng job release được ghi
#     (contents: write) để tạo Release.
#   - Action ghim theo commit SHA (comment ghi phiên bản); checkout không lưu token lại trong .git.
#   - Giá trị từ ${{ }} đi qua biến môi trường, không chèn thẳng vào lệnh shell.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  # Không chạy lại test: chờ và kiểm tra lượt CI trên đúng commit của tag (npm run release push commit đó cùng lúc với tag,
  # nên CI thường vừa bắt đầu — chờ nó chạy xong). CI lỗi, bị huỷ, hoặc không có lượt CI nào thì dừng, không build.
  ci:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Wait for CI on this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wait-for-ci.js "$GITHUB_SHA"

  build:
    needs: [version, ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            target: --linux AppImage --x64
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        shell: bash
        run: npx electron-builder $TARGET --publish never
        env:
          TARGET: ${{ matrix.target }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PokéRoll ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
