# Chạy npm test (test logic bằng Node, test giao diện bằng Electron trên màn hình ảo xvfb).
# Workflow dùng chung: ci.yml (push lên main, pull request) và release.yml (trước khi build) cùng gọi,
# để cấu hình test chỉ nằm ở một chỗ. Không build, không phát hành.
name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 chặn user namespace mà sandbox của Electron cần
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Test giao diện chạy Electron nên cần màn hình ảo
      - run: xvfb-run -a npm test
